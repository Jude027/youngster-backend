<!-- login_and_signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.D. Youngster Enterprise: Login/Signup</title>
    <meta name="description" content="Login to your J.D. Youngster Enterprise account and enjoy affordable data offers with fast delivery!!!">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="My Store/Orders/form_style1.css" type="text/css">
    <link rel="stylesheet" href="My Store/Orders/navigator1.css" type="text/css">
    <link rel="stylesheet" href="login_page.css" type="text/css">
    <link rel="stylesheet" href="login_signup_dashboard.css" type="text/css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Authentication Page -->
    <div class="auth-container" id="authContainer">
        <div class="auth-header">
            <div class="login-logo">
                <i class="fas fa-rocket"></i>
            </div>
            <h1>J.D. Youngster Enterprise</h1>
            <p>Your trusted partner for data services</p>
        </div>
        
        <div class="auth-tabs">
            <div class="auth-tab active" id="loginTab">Login</div>
            <div class="auth-tab" id="signupTab">Sign Up</div>
        </div>
        
        <!-- Login Form -->
        <form class="auth-form" id="loginForm" method="post" action="/login/" enctype="multipart/form-data">
            <div class="form-group">
                <label for="loginEmailAddr">Email</label>
                <input 
                    type="email" 
                    id="loginEmailAddr" 
                    class="form-control" 
                    placeholder="Enter your email address" 
                    required 
                    name="email" 
                    title="Enter a gmail ID eg. example@gmail.com" 
                    value=""
                >
            </div>
            
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input 
                    type="password" 
                    id="loginPassword" 
                    class="form-control" 
                    placeholder="Enter your password" 
                    required 
                    name="password" 
                    title="Enter your password" 
                    value=""
                >
            </div>
            
            <div class="forgot-password">
                <a href="#" id="showForgotPassword">Forgot Password?</a>
            </div>
            
            <button class="btn" id="main-login-btn" type="submit" onclick="btnLoader(this)">Login</button>
            
            <div class="form-footer">
                <p>Don't have an account? <a href="#" id="showSignup">Sign up here</a></p>
            </div>
        </form>
        
        <!-- Sign Up Form -->
        <form id="signupForm" method="post" action="/signup/" enctype="multipart/form-data" class="auth-form hidden">
            <div class="form-group">
                <label for="signupUsername">Username</label>
                <input type="text" id="signupUsername" class="form-control" placeholder="Enter your username" required name="username" value="">
            </div>

            <div class="form-group">
                <label for="signupFullName">Full Name</label>
                <input type="text" id="signupFullName" class="form-control" placeholder="Enter your full name" required name="fullname" value="">
            </div>
            
            <div class="form-group">
                <label for="signupBusinessName">Business Name</label>
                <input type="text" id="signupBusinessName" class="form-control" placeholder="Enter your business name" required name="business_name" value="">
            </div>
            
            <div class="form-group">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" class="form-control" placeholder="Enter your email" required name="signup_email" value="">
            </div>
            
            <div class="form-group">
                <label for="signupPhone">Phone Number</label>
                <input type="tel" id="signupPhone" class="form-control" placeholder="Enter your phone number" required name="phone" value="">
            </div>
            
            <div class="form-group">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" class="form-control" placeholder="Create a password" required name="password" value="">
            </div>
            
            <div class="form-group">
                <label for="signupConfirmPassword">Confirm Password</label>
                <input type="password" id="signupConfirmPassword" class="form-control" placeholder="Confirm your password" required name="confirm-password" value="">
            </div>
            
            <button type="submit" class="btn">Create Account</button>
            
            <div class="form-footer">
                <p>Already have an account? <a href="#" id="showLogin">Login here</a></p>
            </div>
        </form>
        
        <!-- Forgot Password Form -->
        <form method="post" action="/forgotten/" class="auth-form hidden" id="forgotPasswordForm">
            <div class="passwd_reset_info">
                A link will be sent to your email in order to reset your password!
            </div>

            <div class="form-group">
                <input 
                    type="email" 
                    id="forgotEmail" 
                    class="form-control" 
                    placeholder="Enter your email address" 
                    required 
                    name="reset_pwd_email" 
                    title="Enter your registered email address" 
                    value=""
                >
            </div>
            
            <button type="submit" class="btn">Reset Password</button>
            
            <div class="form-footer">
                <p>Remember your password? <a href="#" id="showLoginFromForgot">Back to Login</a></p>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
