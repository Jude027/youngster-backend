<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay with Mobile Money</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .card-header {
            background: #0d1b2a;
            color: white;
            padding: 20px 24px;
            text-align: center;
        }

        .card-header .title {
            font-size: 1.1rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .card-header .amount {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 8px;
        }

        .card-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: #a0aec0;
            font-size: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            color: #2d3748;
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #0d1b2a;
            box-shadow: 0 0 0 3px rgba(13, 27, 42, 0.1);
        }

        .select-control {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            color: #2d3748;
            outline: none;
            background: white;
            cursor: pointer;
        }

        .select-control:focus {
            border-color: #0d1b2a;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: #0d1b2a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: #1a2f45;
        }

        .btn-primary:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        .btn-back {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #718096;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 8px;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: #2d3748;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
        }

        .alert-danger {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #fed7d7;
        }

        .alert.show {
            display: block;
        }

        .error-text {
            color: #c53030;
            font-size: 0.8rem;
            margin-top: 4px;
            display: none;
        }

        .secured-badge {
            text-align: center;
            margin-top: 24px;
            color: #a0aec0;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <div class="title" id="packageNameDisplay">Data Bundle Purchase</div>
            <div class="amount">GH₵<span id="displayAmount">0.00</span></div>
        </div>

        <div class="card-body">
            <div id="alertBox" class="alert alert-danger"></div>

            <div class="form-group">
                <label>Select Mobile Network</label>
                <select id="momoNetwork" class="select-control" onchange="selectMomoNetwork(this.value)">
                    <option value="">-- Choose Network --</option>
                    <option value="MTN">MTN Mobile Money</option>
                    <option value="Telecel">Telecel Cash</option>
                    <option value="AirtelTigo">AT Money</option>
                </select>
                <div id="networkError" class="error-text">Please select a mobile network</div>
            </div>

            <div class="form-group">
                <label>Mobile Money Number</label>
                <div class="input-wrapper">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="phoneNumber" class="form-control" placeholder="e.g. 054XXXXXXX" maxlength="10">
                </div>
                <div id="phoneError" class="error-text">Please enter a valid 10-digit phone number</div>
            </div>

            <button class="btn-primary" id="confirmBtn" onclick="initiatePayment()">
                <i class="fas fa-lock"></i> Confirm Payment
            </button>

            <button class="btn-back" onclick="goBack()">Cancel & Go Back</button>

            <div class="secured-badge">
                <i class="fas fa-shield-alt"></i> Secured by Korba Xchange Gateway
            </div>
        </div>
    </div>

    <script>
        let orderData = null;

        // Load initialization details out of cached storage systems
        try {
            const saved = localStorage.getItem('checkoutOrder');
            if (saved) {
                orderData = JSON.parse(saved);
                document.getElementById('displayAmount').textContent = parseFloat(orderData.amount || 0).toFixed(2);
                if (orderData.package) {
                    document.getElementById('packageNameDisplay').textContent = `${orderData.package} (${orderData.bundle_size || ''})`;
                }
            } else {
                showAlert('No active checkout session found. Returning to catalog.', 'danger');
                setTimeout(() => window.history.back(), 3000);
            }
        } catch(e) {
            console.error('Failed reading storage checkout state:', e);
        }

        async function initiatePayment() {
            const networkSelect = document.getElementById('momoNetwork');
            const phoneInput = document.getElementById('phoneNumber');
            const btn = document.getElementById('confirmBtn');

            // Reset UI warning structures
            document.getElementById('networkError').style.display = 'none';
            document.getElementById('phoneError').style.display = 'none';
            document.getElementById('alertBox').classList.remove('show');

            let hasError = false;

            if (!networkSelect.value) {
                document.getElementById('networkError').style.display = 'block';
                hasError = true;
            }

            const phoneVal = phoneInput.value.trim();
            if (!phoneVal || phoneVal.length !== 10 || !/^\d+$/.test(phoneVal)) {
                document.getElementById('phoneError').style.display = 'block';
                hasError = true;
            }

            if (hasError) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Initializing Security Protocol...';

            try {
                // Dynamically look for relational client profiles across storage frames
                const clientUserId = orderData.userId || orderData.clientId || localStorage.getItem('userId') || null;

                const payload = {
                    gatewayName: "Korba Xchange", 
                    phoneNumber: phoneVal,
                    amount: parseFloat(orderData.amount),
                    provider: networkSelect.value,
                    packageName: orderData.package || 'Data Bundle',
                    bundle_size: orderData.bundle_size || '',
                    userId: clientUserId // 👈 Client trace identity mapped here
                };

                const token = localStorage.getItem('token');
                const headers = {
                    'Content-Type': 'application/json'
                };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const apiBase = (() => { const h = window.location.hostname; return (h==='localhost'||h==='127.0.0.1') ? 'http://localhost:5000' : `http://${h}:5000`; })();
                const res = await fetch(`${apiBase}/api/payment/initiate`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                const result = await res.json();

                if (!res.ok || !result.success) {
                    showAlert(result.message || 'Payment authentication failed.', 'danger');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-lock"></i> Confirm Payment';
                    return;
                }

                localStorage.setItem('paymentTransactionId', result.transactionId);
                localStorage.setItem('pendingOrderData', JSON.stringify({
                    ...orderData,
                    phoneNumber: phoneVal,
                    transactionId: result.transactionId,
                    userId: clientUserId
                }));

                // Store OTP context so the OTP page can read it even without URL params
                localStorage.setItem('otpTransactionId', result.transactionId);
                localStorage.setItem('otpPhoneNumber',   phoneVal);
                const returnUrl = `/Dashboard/payment-processing.html?transactionId=${result.transactionId}`;
                localStorage.setItem('otpReturnUrl', returnUrl);
                window.location.href = `./payment-otp.html?txid=${result.transactionId}&phone=${encodeURIComponent(phoneVal)}&return=${encodeURIComponent(returnUrl)}`;

            } catch (err) {
                console.error("Handshake initialization error:", err);
                showAlert('Could not communicate with payment framework. Check connection.', 'danger');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-lock"></i> Confirm Payment';
            }
        }

        function selectMomoNetwork(val) {
            document.getElementById('networkError').style.display = 'none';
        }

        function goBack() {
            window.history.back();
        }

        function showAlert(msg, type) {
            const el = document.getElementById('alertBox');
            el.textContent = msg;
            el.className = `alert show alert-${type}`;
        }
    </script>
</body>
</html>
