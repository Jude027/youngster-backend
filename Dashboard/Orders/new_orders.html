<!-- new_orders.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Orders - J.D. Youngster Enterprise</title>
    <meta name="description" content="Login to your J.D. Youngster Enterprise account and enjoy affordable data offers with fast delivery!!!">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="form_style1.css" type="text/css">
    <link rel="stylesheet" href="navigator1.css" type="text/css">
    <link rel="stylesheet" href="login_page.css" type="text/css">
    <link rel="stylesheet" href="orders.css" type="text/css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Orders Data -->
    <script id="orders-data" type="application/json">
    [
        {
            "beneficiary": "0241234567",
            "package": "MTN",
            "amount": "50.00",
            "bundle_size": "2GB",
            "created": "2025-02-10",
            "completed": "2025-02-10",
            "status": "completed",
            "report": "Successful"
        },
        {
            "beneficiary": "0559876543",
            "package": "AT",
            "amount": "100.00",
            "bundle_size": "5GB",
            "created": "2025-02-12",
            "completed": "2025-02-12",
            "status": "processing",
            "report": "Processing"
        },
        {
            "beneficiary": "0205551234",
            "package": "Telecel",
            "amount": "25.00",
            "bundle_size": "1GB",
            "created": "2025-02-14",
            "completed": "",
            "status": "pending",
            "report": "Awaiting"
        }
    ]
    </script>
</head>
<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="close-btn" id="closeBtn">
                <i class="fas fa-times"></i>
            </button>
            <div class="sidebar-title" id="sidebarTitle">J.D Youngster Enterprise</div>
            <div class="brand-logo" id="sidebarLogo">
                <img src="WhatsApp Image 2026-01-31 at 4.07.11 PM.jpeg" alt="J.D You Logo">
            </div>
        </div>
        <ul class="menu">
            <!-- Dashboard -->
            <a href="../dashboard2.html" class="menu-item" id="dashboardMenuLink">
                <i class="fas fa-tachometer-alt"></i>
                <span class="menu-text">Dashboard</span>
            </a>

            <a href="#" class="menu-item active">
                <i class="fas fa-shopping-cart"></i>
                <span class="menu-text">Orders</span>
            </a>
            
            <!-- Transactions -->
            <a href="../Transactions/transactions2.html" class="menu-item">
                <i class="fas fa-exchange-alt"></i>
                <span class="menu-text">Transactions</span>
            </a>
        </ul>
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
        <div class="orders-container">
            <div class="orders-header">
                <div class="header-left">
                    <div class="top-row">
                        <button class="menu-btn" id="menuBtn">
                            <i class="fas fa-bars"></i>
                        </button>
                        <div class="header-title-section">
                            <div class="header-title-text">
                                <h1 class="header-orders-title">All Orders</h1>
                                <p class="header-orders-subtitle">Manage All your orders here</p>
                            </div>
                        </div>
                    </div>
                    <div class="bottom-row">
                        <button class="search-btn" id="searchBtn">
                            <i class="fas fa-search"></i>
                        </button>
                        <div class="search-bar" id="searchBar">
                            <input type="text" class="search-input" placeholder="Search orders...">
                        </div>
                    </div>
                </div>
                <div class="header-right">
                    <div class="search-container">
                        <button class="search-btn" id="searchBtnDesktop">
                            <i class="fas fa-search"></i>
                        </button>
                        <div class="search-bar" id="searchBarDesktop">
                            <input type="text" class="search-input" placeholder="Search orders...">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="orders-content">
                <div class="table-header">
                    <div class="table-title-section">
                        <div class="orders-icon">
                            <i class="fas fa-list"></i>
                        </div>
                        <div class="title-text">
                            <h1 class="orders-title">Order History</h1>
                            <p class="orders-subtitle">Recent orders and their status</p>
                        </div>
                    </div>
                    <button class="refresh-btn" id="refreshBtn">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                
                <!-- Filters Section -->
                <div class="filters-section">
                    <div class="filters-header">
                        <h3 class="filters-title">
                            <i class="fas fa-filter"></i>
                            Filter Orders
                        </h3>
                        <button class="clear-filters-btn" id="clearFiltersBtn">
                            Clear All Filters
                        </button>
                    </div>
                    
                    <div class="filters-grid">
                        <!-- Date Range Filter -->
                        <div class="filter-group">
                            <label class="filter-label">
                                <i class="fas fa-calendar"></i>
                                Date Range
                            </label>
                            <div class="date-range-container">
                                <input type="date" class="filter-input" id="dateFrom">
                                <span>to</span>
                                <input type="date" class="filter-input" id="dateTo">
                            </div>
                        </div>
                        
                        <div class="filter-group">
                            <label class="filter-label">
                                <i class="fas fa-tag"></i>
                                Status
                            </label>
                            <select class="filter-select" id="statusFilter">
                                <option value="">All Statuses</option>
                                <option value="pending">Pending</option>
                                <option value="processing">Processing</option>
                                <option value="completed">Completed</option>
                                <option value="failed">Failed</option>
                                <option value="cancelled/refunded">Cancelled/refunded</option>
                                <option value="resolved">Resolved</option>
                            </select>
                        </div>
                        
                        <div class="filter-group">
                            <label class="filter-label">
                                <i class="fas fa-box"></i>
                                Package Type
                            </label>
                            <select class="filter-select" id="packageFilter">
                                <option value="">All Packages</option>
                                <option value="MTNUP2U">MTN</option>
                                <option value="AT">AT</option>
                                <option value="Telecel">Telecel</option>
                                <option value="AFA">MTN AFA</option>
                            </select>
                        </div>
                        
                        <div class="filter-group">
                            <label class="filter-label">
                                <i class="fas fa-sort-amount-down"></i>
                                Sort By
                            </label>
                            <select class="filter-select" id="sortFilter">
                                <option value="newest">Newest First</option>
                                <option value="oldest">Oldest First</option>
                                <option value="amount-high">Amount (High to Low)</option>
                                <option value="amount-low">Amount (Low to High)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="filter-actions">
                        <button class="filter-btn reset" id="resetFiltersBtn">
                            <i class="fas fa-redo"></i>
                            Reset
                        </button>
                        <button class="filter-btn apply" id="applyFiltersBtn">
                            <i class="fas fa-check"></i>
                            Apply Filters
                        </button>
                    </div>
                </div>
                
                <!-- Table Container with loading state -->
                <div style="position: relative;">
                    <table class="orders-table" id="ordersTable">
                        <thead>
                            <tr>
                                <th>BENEFICIARY</th>
                                <th>PACKAGE</th>
                                <th>AMOUNT</th>
                                <th>BUNDLE SIZE</th>
                                <th>CREATED</th>
                                <th>COMPLETED</th>
                                <th>STATUS</th>
                                <th>REPORT</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <!-- Orders will be populated here -->
                        </tbody>
                    </table>
                    
                    <!-- Loading overlay -->
                    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="orders.js"></script>
</body>
</html>
