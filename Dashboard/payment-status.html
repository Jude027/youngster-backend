<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status - My Store</title>
    <link rel="stylesheet" href="./dashboard.css">
    <style>
        .payment-status-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .status-header {
            margin-bottom: 30px;
        }

        .status-icon {
            font-size: 60px;
            margin: 20px 0;
            animation: fadeIn 0.5s;
        }

        .status-title {
            font-size: 24px;
            font-weight: 600;
            margin: 20px 0;
        }

        .status-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .status-details {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }

        .detail-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
            word-break: break-all;
        }

        .status-success .status-icon {
            color: #28a745;
        }

        .status-pending .status-icon {
            color: #ffc107;
        }

        .status-failed .status-icon {
            color: #dc3545;
        }

        .status-success .status-title {
            color: #28a745;
        }

        .status-pending .status-title {
            color: #ffc107;
        }

        .status-failed .status-title {
            color: #dc3545;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .auto-refresh-notice {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="payment-status-container" id="statusContainer">
        <div class="status-header">
            <div class="spinner"></div>
            <div class="status-title">Checking Payment Status...</div>
            <div class="status-message">Please wait while we verify your transaction</div>
        </div>
    </div>

    <script>
        const transactionId = new URLSearchParams(window.location.search).get('transactionId');

        document.addEventListener('DOMContentLoaded', async () => {
            if (!transactionId) {
                showStatus('error', 'Invalid Transaction', 'No transaction ID found', {});
                return;
            }

            // Check payment status every 2 seconds for up to 2 minutes
            const maxAttempts = 60;
            let attempts = 0;

            const checkInterval = setInterval(async () => {
                attempts++;
                const result = await checkPaymentStatus(transactionId);

                if (result.status === 'success') {
                    clearInterval(checkInterval);
                    showStatus('success', 'Payment Successful', 'Your payment has been processed successfully!', result.transaction);
                } else if (result.status === 'failed') {
                    clearInterval(checkInterval);
                    showStatus('failed', 'Payment Failed', 'The payment transaction failed. Please try again.', result.transaction);
                } else if (result.status === 'cancelled') {
                    clearInterval(checkInterval);
                    showStatus('failed', 'Payment Cancelled', 'The payment was cancelled.', result.transaction);
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    showStatus('pending', 'Payment Pending', 
                        'We\'re still processing your payment. You\'ll receive a confirmation via SMS shortly. Transaction ID: ' + transactionId,
                        result.transaction);
                }
            }, 2000);
        });

        async function checkPaymentStatus(txId) {
            try {
                const token = localStorage.getItem('token');
                const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
                const response = await fetch(`http://localhost:5000/api/payment/status/${txId}`, { headers });
                if (!response.ok) throw new Error('Failed to check status');
                return await response.json();
            } catch (err) {
                console.error('Status check error:', err);
                return { status: 'pending', transaction: {} };
            }
        }

        function showStatus(statusClass, title, message, transaction) {
            const container = document.getElementById('statusContainer');
            
            const icon = {
                'success': '✓',
                'pending': '⏱',
                'failed': '✕',
                'error': '!'
            }[statusClass] || '?';

            let details = '';
            if (transaction && Object.keys(transaction).length > 0) {
                details = `
                    <div class="status-details">
                        <div class="detail-row">
                            <span class="detail-label">Transaction ID:</span>
                            <span class="detail-value">${transaction.transactionId || '-'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Amount:</span>
                            <span class="detail-value">GHS ${(transaction.totalAmount || 0).toFixed(2)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Provider:</span>
                            <span class="detail-value">${transaction.provider || '-'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Phone:</span>
                            <span class="detail-value">${transaction.phoneNumber || '-'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Status:</span>
                            <span class="detail-value">${(transaction.status || '-').toUpperCase()}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Time:</span>
                            <span class="detail-value">${new Date(transaction.initiatedAt).toLocaleString()}</span>
                        </div>
                        ${transaction.errorMessage ? `
                        <div class="detail-row">
                            <span class="detail-label">Error:</span>
                            <span class="detail-value">${transaction.errorMessage}</span>
                        </div>
                        ` : ''}
                    </div>
                `;
            }

            const buttons = {
                'success': `
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="(function(){ var s=new URLSearchParams(window.location.search).get('store')||localStorage.getItem('storeSlug'); window.location.href = s ? '/Dashboard/dashboard2?store='+s : './dashboard2.html'; })()" >Back to Dashboard</button>
                    </div>
                `,
                'failed': `
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="(function(){ var s=new URLSearchParams(window.location.search).get('store')||localStorage.getItem('storeSlug'); window.location.href = s ? '/Dashboard/dashboard2?store='+s : './dashboard2.html'; })()" >Try Again</button>
                        <button class="btn btn-secondary" onclick="(function(){ var s=new URLSearchParams(window.location.search).get('store')||localStorage.getItem('storeSlug'); window.location.href = s ? '/Dashboard/dashboard2?store='+s : './dashboard2.html'; })()" >Cancel</button>
                    </div>
                `,
                'pending': `
                    <div class="action-buttons">
                        <button class="btn btn-secondary" onclick="location.reload()">Refresh</button>
                        <button class="btn btn-primary" onclick="(function(){ var s=new URLSearchParams(window.location.search).get('store')||localStorage.getItem('storeSlug'); window.location.href = s ? '/Dashboard/dashboard2?store='+s : './dashboard2.html'; })()" >Back to Dashboard</button>
                    </div>
                    <div class="auto-refresh-notice">This page will auto-refresh every 2 seconds</div>
                `,
                'error': `
                    <div class="action-buttons">
                        <button class="btn btn-secondary" onclick="window.history.back()">Go Back</button>
                    </div>
                `
            }[statusClass] || '';

            container.innerHTML = `
                <div class="status-header">
                    <div class="status-icon">${icon}</div>
                    <div class="status-title">${title}</div>
                    <div class="status-message">${message}</div>
                </div>
                ${details}
                ${buttons}
            `;
            
            container.className = `payment-status-container status-${statusClass}`;
        }
    </script>
</body>
</html>
