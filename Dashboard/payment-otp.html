<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Payment OTP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 36px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.10);
            text-align: center;
        }

        .icon-wrap {
            width: 70px; height: 70px;
            background: #fff3e0;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px; color: #f57c00;
        }

        h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 8px; }

        .sub {
            color: #666; font-size: 14px; line-height: 1.6;
            margin-bottom: 28px;
        }
        .sub strong { color: #333; }

        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .otp-inputs input {
            width: 48px; height: 56px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 22px; font-weight: 700;
            text-align: center;
            color: #1a1a2e;
            outline: none;
            transition: border-color 0.2s;
        }
        .otp-inputs input:focus { border-color: #6200ff; }
        .otp-inputs input.filled { border-color: #6200ff; background: #f3eeff; }

        .timer {
            font-size: 13px; color: #999;
            margin-bottom: 20px;
        }
        .timer span { color: #e53935; font-weight: 600; }

        .btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #6200ff, #4500b3);
            color: white; border: none;
            border-radius: 10px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: opacity 0.2s;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:not(:disabled):hover { opacity: 0.9; }

        .resend {
            margin-top: 16px; font-size: 13px; color: #999;
        }
        .resend button {
            background: none; border: none;
            color: #6200ff; font-weight: 600;
            cursor: pointer; font-size: 13px;
        }
        .resend button:disabled { color: #ccc; cursor: not-allowed; }

        .status-msg {
            margin-top: 16px; padding: 12px 16px;
            border-radius: 8px; font-size: 14px;
            display: none;
        }
        .status-msg.error   { background: #fdecea; color: #c62828; display: block; }
        .status-msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
        .status-msg.loading { background: #e3f2fd; color: #1565c0; display: block; }

        .spinner { display: inline-block; width: 16px; height: 16px;
            border: 2px solid currentColor; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-wrap"><i class="fas fa-shield-alt"></i></div>
    <h1>Enter OTP</h1>
    <p class="sub">
        An OTP has been sent to <strong id="phoneDisplay">your phone</strong> via SMS.<br>
        Enter it below to authorise the payment.
    </p>

    <div class="otp-inputs" id="otpInputs">
        <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
    </div>

    <div class="timer">OTP expires in <span id="countdown">05:00</span></div>

    <button class="btn" id="submitBtn" disabled onclick="submitOtp()">
        Verify & Pay
    </button>

    <div class="resend">
        Didn't receive it?
        <button id="resendBtn" disabled onclick="resendOtp()">Resend OTP</button>
    </div>

    <div class="status-msg" id="statusMsg"></div>
</div>

<script>
    // ── Read context from URL params (set by the payment initiation flow) ────
    const params        = new URLSearchParams(window.location.search);
    const transactionId = params.get('txid')   || localStorage.getItem('otpTransactionId')   || '';
    const phoneNumber   = params.get('phone')  || localStorage.getItem('otpPhoneNumber')     || '';
    const returnUrl     = params.get('return') || localStorage.getItem('otpReturnUrl')        || '/Dashboard/payment-processing.html?transactionId=' + transactionId;

    // Persist to localStorage so a page refresh doesn't lose context
    if (transactionId) localStorage.setItem('otpTransactionId', transactionId);
    if (phoneNumber)   localStorage.setItem('otpPhoneNumber',   phoneNumber);
    if (returnUrl)     localStorage.setItem('otpReturnUrl',     returnUrl);
    const API_BASE = (() => {
        const h = window.location.hostname;
        return (h === 'localhost' || h === '127.0.0.1')
            ? 'http://localhost:5000'
            : window.location.origin;
    })();

    document.getElementById('phoneDisplay').textContent =
        phoneNumber ? phoneNumber.replace(/(\d{3})\d{4}(\d{3})/, '$1****$2') : 'your phone';

    // ── OTP inputs: auto-advance and auto-submit ──────────────────────────────
    const inputs   = Array.from(document.querySelectorAll('.otp-inputs input'));
    const submitBtn = document.getElementById('submitBtn');

    inputs.forEach((inp, i) => {
        inp.addEventListener('input', () => {
            inp.value = inp.value.replace(/\D/g, '');
            if (inp.value) {
                inp.classList.add('filled');
                if (i < inputs.length - 1) inputs[i + 1].focus();
            } else {
                inp.classList.remove('filled');
            }
            checkReady();
        });

        inp.addEventListener('keydown', e => {
            if (e.key === 'Backspace' && !inp.value && i > 0) {
                inputs[i - 1].value = '';
                inputs[i - 1].classList.remove('filled');
                inputs[i - 1].focus();
                checkReady();
            }
        });

        // Handle paste of full OTP code
        inp.addEventListener('paste', e => {
            e.preventDefault();
            const pasted = (e.clipboardData || window.clipboardData)
                .getData('text').replace(/\D/g, '').slice(0, 6);
            pasted.split('').forEach((ch, idx) => {
                if (inputs[idx]) {
                    inputs[idx].value = ch;
                    inputs[idx].classList.add('filled');
                }
            });
            const next = inputs[Math.min(pasted.length, inputs.length - 1)];
            next.focus();
            checkReady();
        });
    });

    function getOtpValue() {
        return inputs.map(i => i.value).join('');
    }

    function checkReady() {
        submitBtn.disabled = getOtpValue().length < 6;
    }

    inputs[0].focus();

    // ── Countdown timer ───────────────────────────────────────────────────────
    let secondsLeft  = 5 * 60; // 5 minutes
    let resendAllowed = false;
    const countdownEl = document.getElementById('countdown');
    const resendBtn   = document.getElementById('resendBtn');

    const timer = setInterval(() => {
        secondsLeft--;
        const m = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
        const s = String(secondsLeft % 60).padStart(2, '0');
        countdownEl.textContent = `${m}:${s}`;

        if (secondsLeft <= 60 && !resendAllowed) {
            resendAllowed = true;
            resendBtn.disabled = false;
        }
        if (secondsLeft <= 0) {
            clearInterval(timer);
            countdownEl.textContent = 'Expired';
            submitBtn.disabled = true;
            showStatus('error', 'OTP has expired. Please request a new one.');
        }
    }, 1000);

    // ── Submit OTP ────────────────────────────────────────────────────────────
    async function submitOtp() {
        const otp = getOtpValue();
        if (otp.length < 6) return;

        submitBtn.disabled = true;
        showStatus('loading', '<span class="spinner"></span> Verifying OTP…');

        try {
            const res  = await fetch(`${API_BASE}/api/payment/verify-otp`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ transactionId, otpCode: otp }),
            });
            const data = await res.json();

            if (data.success) {
                clearInterval(timer);
                showStatus('success', '✅ OTP verified! Payment prompt sent to your phone. Please check your phone and enter your MoMo PIN to complete the payment.');
                submitBtn.textContent = '✅ Verified';

                // Clean up OTP context from localStorage
                localStorage.removeItem('otpTransactionId');
                localStorage.removeItem('otpPhoneNumber');
                localStorage.removeItem('otpReturnUrl');

                // Redirect to processing page after short delay
                setTimeout(() => {
                    window.location.href = returnUrl
                        + (returnUrl.includes('?') ? '&' : '?')
                        + `txid=${encodeURIComponent(transactionId)}&verified=1`;
                }, 3000);
            } else {
                showStatus('error', data.message || 'OTP verification failed. Please try again.');
                inputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
                inputs[0].focus();
                checkReady();
                submitBtn.disabled = false;
            }
        } catch (err) {
            showStatus('error', 'Network error. Please try again.');
            submitBtn.disabled = false;
        }
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !submitBtn.disabled) submitOtp();
    });

    // ── Resend OTP ────────────────────────────────────────────────────────────
    async function resendOtp() {
        resendBtn.disabled = true;
        showStatus('loading', '<span class="spinner"></span> Resending OTP…');

        try {
            const res  = await fetch(`${API_BASE}/api/payment/initiate`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({
                    // The backend will create a new transaction — just trigger a fresh initiation
                    transactionId,
                    resend: true,
                }),
            });
            // For simplicity, just tell the user to check their phone
            showStatus('success', 'A new OTP has been sent. Please check your SMS.');
            secondsLeft  = 5 * 60;
            resendAllowed = false;
        } catch {
            showStatus('error', 'Could not resend OTP. Please try again.');
            resendBtn.disabled = false;
        }
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function showStatus(type, html) {
        const el = document.getElementById('statusMsg');
        el.className = `status-msg ${type}`;
        el.innerHTML = html;
    }
</script>
</body>
</html>
